<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task4</title>
    <script>
        let time = prompt("Введите число:")
        if (time >= 0 && time <= 15) {
            alert("Число находится в первой четверти.");
        } else if (time >= 15 && time <= 30) {
            alert("Число находится в второй четверти.");
        } else if (time >= 30 && time <= 45) {
            alert("Число находится в третьей четверти.");
        } else if (time >= 45 && time <= 59) {
            alert("Число находится в четвёртой четверти.");
        }

        let lang = prompt("ru или by?");
        let week;
        switch(lang) {
            case "ru":
                week = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
            break;
            case "by":
                week = ["Панядзелак","Ауторак","Серада","Чацвер","Пятница","Субота","Нядзеля"];
            break;
        }

        alert(week);
    </script>
